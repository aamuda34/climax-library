<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLIMAX Library</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">C</div>
        <div>
          <strong>CLIMAX Library</strong>
          <span>Online School Library</span>
        </div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab">Sign in</button>
        <button class="auth-tab" id="registerTab">Register</button>
      </div>

      <div id="message"></div>

      <form id="loginForm">
        <label>Email
          <input id="loginEmail" type="email" required autocomplete="email">
        </label>

        <label>Password
          <input id="loginPassword" type="password" required autocomplete="current-password">
        </label>

        <button class="primary-btn" type="submit">Sign in</button>
      </form>

      <form id="registerForm" style="display:none">
        <label>Full name
          <input id="fullName" type="text" required autocomplete="name">
        </label>

        <label>Email
          <input id="registerEmail" type="email" required autocomplete="email">
        </label>

        <label>Password
          <input id="registerPassword" type="password" minlength="6" required autocomplete="new-password">
        </label>

        <label>Student ID
          <input id="studentId" type="text" placeholder="Optional">
        </label>

        <label>Level
          <select id="level" required>
            <option value="">Choose your level</option>
            <option>JSS1</option>
            <option>JSS2</option>
            <option>JSS3</option>
            <option>SSS1</option>
            <option>SSS2</option>
            <option>SSS3</option>
          </select>
        </label>

        <label id="departmentWrap" style="display:none">Department
          <select id="department">
            <option value="">Choose department</option>
            <option>Science</option>
            <option>Commercial</option>
            <option>Arts</option>
          </select>
        </label>

        <button class="primary-btn" type="submit">Create student account</button>
      </form>
    </section>
  </main>

  <script type="module">
    import { supabase } from '/src/supabase.js';

    const loginTab = document.querySelector('#loginTab');
    const registerTab = document.querySelector('#registerTab');
    const loginForm = document.querySelector('#loginForm');
    const registerForm = document.querySelector('#registerForm');
    const message = document.querySelector('#message');
    const level = document.querySelector('#level');
    const departmentWrap = document.querySelector('#departmentWrap');

    function showMessage(text, error = false) {
      message.innerHTML = `
        <div style="
          margin-bottom:16px;
          padding:11px 13px;
          border-radius:10px;
          background:${error ? '#fbe8e8' : '#e8f5ec'};
          color:${error ? '#963636' : '#23703b'};
          font-size:13px;
        ">${text}</div>
      `;
    }

    function switchMode(mode) {
      const login = mode === 'login';

      loginTab.classList.toggle('active', login);
      registerTab.classList.toggle('active', !login);

      loginForm.style.display = login ? 'grid' : 'none';
      registerForm.style.display = login ? 'none' : 'grid';

      message.innerHTML = '';
    }

    loginTab.onclick = () => switchMode('login');
    registerTab.onclick = () => switchMode('register');

    level.addEventListener('change', () => {
      const sss = level.value.startsWith('SSS');
      departmentWrap.style.display = sss ? 'grid' : 'none';
      document.querySelector('#department').required = sss;
    });

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();

      const email = document.querySelector('#loginEmail').value.trim();
      const password = document.querySelector('#loginPassword').value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage(error.message, true);
        return;
      }

      if (data.user) {
        const { data: profile } = await supabase
          .from('profiles')
          .select('role,status')
          .eq('id', data.user.id)
          .single();

        if (profile?.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/student.html';
        }
      }
    });

    registerForm.addEventListener('submit', async event => {
      event.preventDefault();

      const fullName = document.querySelector('#fullName').value.trim();
      const email = document.querySelector('#registerEmail').value.trim();
      const password = document.querySelector('#registerPassword').value;
      const studentId = document.querySelector('#studentId').value.trim();
      const selectedLevel = level.value;
      const selectedDepartment = document.querySelector('#department').value;

      if (selectedLevel.startsWith('SSS') && !selectedDepartment) {
        showMessage('Please choose your department.', true);
        return;
      }

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            student_id: studentId || null,
            level: selectedLevel,
            department: selectedLevel.startsWith('SSS')
              ? selectedDepartment
              : null
          }
        }
      });

      if (error) {
        showMessage(error.message, true);
        return;
      }

      if (data.user) {
        showMessage(
          'Registration successful. Your account is now PENDING approval by the library administrator.'
        );
        registerForm.reset();
      }
    });

    async function checkExistingSession() {
      const { data } = await supabase.auth.getSession();

      if (!data.session) return;

      const { data: profile } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', data.session.user.id)
        .single();

      if (profile?.role === 'admin') {
        window.location.href = '/admin.html';
      } else {
        window.location.href = '/student.html';
      }
    }

    checkExistingSession();
  </script>
</body>
</html>
