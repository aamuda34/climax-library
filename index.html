<!DOCTYPE html>
<html>
<head>
  <title>CLIMAX Library</title>
</head>
<body>
  <h1>Welcome to CLIMAX Library</h1>
  <p>Select Class Level:</p>
  <select id="classLevel" onchange="loadBooks()">
    <option value="SS1">SS1</option>
    <option value="SS2">SS2</option>
    <option value="SS3">SS3</option>
    <option value="ND1">ND1</option>
    <option value="ND2">ND2</option>
    <option value="HND">HND</option>
  </select>

  <!-- This is the empty box where books will appear -->
  <div id="books"></div>

  <!-- This connects your page to the Supabase code -->
  <script type="module" src="script.js"></script>
</body>
</html>
