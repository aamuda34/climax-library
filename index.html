<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CLIMAX Library</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    #classLevel {
      display: block;
      margin: 0 auto 20px auto;
      padding: 8px;
      font-size: 1em;
    }
    #booksContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .book-card {
      border: 1px solid #ccc;
      padding: 15px;
      text-align: center;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .book-card img {
      max-width: 100%;
      height: auto;
      margin-bottom: 10px;
      border-radius: 4px;
    }
    .book-card h3 {
      margin: 10px 0;
      font-size: 1.1em;
      color: #222;
    }
    .book-card p {
      margin: 5px 0;
      color: #555;
    }
    .book-card a {
      display: inline-block;
      margin-top: 10px;
      color: #0066cc;
      text-decoration: none;
      font-weight: bold;
    }
    .book-card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Welcome to CLIMAX Library</h1>
  <label>Select Class Level:</label>
  <select id="classLevel">
    <option value="SS1">SS1</option>
    <option value="SS2">SS2</option>
    <option value="SS3">SS3</option>
    <option value="ND1">ND1</option>
    <option value="ND2">ND2</option>
    <option value="HND">HND</option>
  </select>

  <div id="booksContainer"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = "https://tgerdrdangqrbffjxdbb.supabase.co"
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnZXJkcmRhbmdxcmJmZmp4ZGJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDgxNjUsImV4cCI6MjEwNDMyNDE2NX0.DjWbXXei1lzSDilHc06BS8Yd02jgZqkVAPuhzOCTP1w"
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    async function loadBooks(classLevel) {
      const { data: books, error } = await supabase
        .from("books")
        .select("*")
        .eq("class_level", classLevel)

      const container = document.getElementById("booksContainer")
      container.innerHTML = ""

      if (error) {
        container.innerHTML = "<p style='color:red'>Error loading books: " + error.message + "</p>"
        return
      }

      books.forEach(book => {
        const card = `
          <div class="book-card">
            <h3>${book.title}</h3>
            <img src="${book.cover_url}" alt="${book.title}">
            <p>Category: ${book.category}</p>
            <p>Class Level: ${book.class_level}</p>
            <a href="${book.pdf_url}" target="_blank">Read PDF</a>
          </div>
        `
        container.innerHTML += card
      })
    }

    document.getElementById("classLevel").addEventListener("change", (e) => {
      loadBooks(e.target.value)
    })

    // Load default SS1 books
    loadBooks("SS1")
  </script>
</body>
</html>
